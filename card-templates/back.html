<div class="header">{{English}}</div>

<div id="container">
	<!-- Maps will appear here -->

	<div id="distance-container">
		<div class="distance">
			Distance from guess (km)
		</div>
		<b id="distance-value"></b>
	</div>
</div>

<hr>

<div class="left-align">
	{{#Population}}
		<b>Population:</b> {{Population}}<br>
	{{/Population}}<br>

	<b>Links:</b><br>
	{{#Wikipedia ID}}
		・<a href="https://en.wikipedia.org/wiki/{{Wikipedia ID}}">Wikipedia</a><br>
	{{/Wikipedia ID}}
	・<a href="https://www.wikidata.org/wiki/{{Wikidata ID}}">Wikidata</a><br>
	・<a href="https://www.google.dk/maps/search/{{Wikipedia ID}}?source=opensearch">Google Maps</a>
</div>

<div id="map-data" style="display:none;">{{Maps}}</div>

<p id="console"/>


<script type="text/javascript">
try {

	/* -------------------- CONFIG -------------------- */

	// Change this to false to disable distance box when a guess has been made
	var DISPLAY_GUESS_DISTANCE = true;

	var MAP_FIELDS = [
		"image", "artist", "cc", "name",
		"top", "bottom", "left", "right",
		"xFormula", "yFormula"
	];

	var $container = document.querySelector('#container');
	var $distanceValue = document.querySelector('#distance-value');
	var $distanceContainer = document.querySelector('#distance-container');
	var $console = document.querySelector('#console');

	/* -------------------- DATA -------------------- */

	var rawMaps = document.getElementById('map-data').innerHTML.split(';;');
	var coords = rawMaps.shift().split(' ');
	var maps = rawMaps.map(parseMap);

	var len = maps.length;

	// Gets variables from front side
	var mapIdx = parseInt(sessionStorage.getItem("mapIdx"));
	var guessLong = parseFloat(sessionStorage.getItem("guessLong"));
	var guessLat = parseFloat(sessionStorage.getItem("guessLat"));
	var guessXStored = parseFloat(sessionStorage.getItem("guessX"));
	var guessYStored = parseFloat(sessionStorage.getItem("guessY"));
	var guessIdx = parseInt(sessionStorage.getItem("guessIdx"));

	/* -------------------- HELPERS -------------------- */

	function parseMap(str) {
		var values = str.split('|');
		var obj = {};
		MAP_FIELDS.forEach(function(field, i) {
			obj[field] = values[i] || "";
		});
		return obj;
	}

	// Avoid negative modulo result
	function mod(n, m) {
		return ((n % m) + m) % m;
	}

	function getX(long, left, right) {
		left = parseFloat(left);
		right = parseFloat(right);

		var width = mod(right - left, 360);
		if (width == 0) width = 360;

		var distFromLeft = mod(long - left, 360);
		if (distFromLeft - width / 2 >= 180) {
			distFromLeft = distFromLeft - 360;
		}
		return 100 * distFromLeft / width;
	}

	function getY(lat, top, bottom) {
		top = parseFloat(top);
		bottom = parseFloat(bottom);
		return 100 * (top - lat) / (top - bottom);
	}

	// Used for special maps like Japan, USA
	function getCustom(lat, long, formula) {
		// Unescape characters in formula
		var doc = new DOMParser().parseFromString(formula, "text/html");
		formula = doc.documentElement.textContent;

		return eval(formula.replaceAll("$1", lat).replaceAll("$2", long));
	}

	function getDist(lat1, long1, lat2, long2) {
		var R = 6371; // Earth radius in km

		var φ1 = lat1 * Math.PI/180;
		var φ2 = lat2 * Math.PI/180;
		var Δφ = (lat2 - lat1) * Math.PI/180;
		var Δλ = (long2 - long1) * Math.PI/180;

		var a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
				Math.cos(φ1) * Math.cos(φ2) *
				Math.sin(Δλ/2) * Math.sin(Δλ/2);

		var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

		return parseInt(R * c); // In km
	}

	/* -------------------- MAP TEMPLATE -------------------- */

	var elementString = `
<div class="map-w-txt">
	<div class="map-container">
		<div class="map-w-pog">
			<div class="pog-guess pog-outer">
				<div class="pog-inner">
					<svg xmlns="http://www.w3.org/2000/svg" version="1.0" width="18" height="18">
						<defs>
			  			<radialGradient id="Orange" cx="0.5" cy="0.5" r="0.5" fx="0.25" fy="0.25">
								<stop offset="0%" stop-color="#FFFFFF"/>
								<stop offset="50%" stop-color="#FFAA00"/>
								<stop offset="75%" stop-color="#CC5500"/>
								<stop offset="100%" stop-color="#000000"/>
							</radialGradient>
						</defs>
						<circle r="6" cx="9" cy="9" fill="url(#Orange)"/>
					</svg>
				</div>
			</div>
			<div class="pog-correct pog-outer">
				<div class="pog-inner">
					<svg xmlns="http://www.w3.org/2000/svg" version="1.0" width="18" height="18">
						<defs>
				 			<radialGradient id="Red" cx="0.5" cy="0.5" r="0.5" fx="0.25" fy="0.25">
								<stop offset="0%" stop-color="#FFFFFF"/>
								<stop offset="50%" stop-color="#DD3333"/>
								<stop offset="75%" stop-color="#990000"/>
								<stop offset="100%" stop-color="#000000"/>
							</radialGradient>
						</defs>
						<circle r="6" cx="9" cy="9" fill="url(#Red)"/>
					</svg>
				</div>
			</div>
			<div class="map"></div>
		</div>
	</div>
	<div class="name-credit">
		<div class="name"></div>
		<div class="credit"></div>
	</div>
</div>`;

	/* -------------------- RENDER ALL MAPS -------------------- */

	for (var i = 0; i < len; i++) {

		var e = document.createElement('div');
		e.innerHTML = elementString.replaceAll('Orange', 'Orange' + i).replaceAll('Red', 'Red' + i);

		var $map = e.querySelector('.map');
		var $name = e.querySelector('.name');
		var $credit = e.querySelector('.credit');
		var $pogGuess = e.querySelector('.pog-guess');
		var $pogCorrect = e.querySelector('.pog-correct');

		var map = maps[i];

		$map.innerHTML = map.image;
		$name.innerHTML = map.name;

		$credit.innerHTML = map.artist
			? decodeURIComponent(`<a href="${map.cc}">©</a> ${map.artist}`)
			: '';

		var correctX, correctY, guessX, guessY;

		if (map.top) {
            // Map uses regular lat/long coordinates
			correctX = getX(coords[0], map.left, map.right);
			correctY = getY(coords[1], map.top, map.bottom);
		} else {
            // Map calculates coordinates with custom formulas
			correctX = getCustom(coords[1], coords[0], map.xFormula);
			correctY = getCustom(coords[1], coords[0], map.yFormula);
		}

		if (i == guessIdx) {
			// Use stored pixel percentages from front side
			guessX = guessXStored;
			guessY = guessYStored;
		} else if (guessLat === 0 && guessLong === 0) {
			// Don't show guess on other maps if guess was on a special map
			guessX = -100;
			guessY = -100;
		} else if (map.top) {
			guessX = getX(guessLong, map.left, map.right);
			guessY = getY(guessLat, map.top, map.bottom);
		} else {
			guessX = getCustom(guessLat, guessLong, map.xFormula);
			guessY = getCustom(guessLat, guessLong, map.yFormula);
		}

        // Set correct pog
		$pogCorrect.style =
			"left:" + correctX + "%;top:" + correctY + "%;display:initial;";

        // Set guess if inside map
		(0 <= guessX && guessX <= 100 && 0 <= guessY && guessY <= 100)
			? $pogGuess.style = "left:" + guessX + "%;top:" + guessY + "%;display:initial;"
			: $pogGuess.style = "display:none;";

		// The map from front side is displayed first
		if (i == mapIdx) {
			$container.insertAdjacentElement('beforebegin', e);
		} else {
			$container.insertAdjacentElement('beforeend', e);
		}
	}

	/* -------------------- DISTANCE -------------------- */

	if (DISPLAY_GUESS_DISTANCE && guessLat && guessLong) {
		var dist = getDist(coords[1], coords[0], guessLat, guessLong);
		$distanceValue.innerHTML = dist;
	} else {
		$distanceContainer.style.display = "none";
	}

} catch (error) {
	document.querySelector('#console').innerHTML = error;
}
</script>
